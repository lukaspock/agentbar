name: AgentBar
options:
  bundleIdPrefix: com.agentbar
  deploymentTarget:
    macOS: "14.0"
packages:
  AgentBarCore:
    path: ../Packages/AgentBarCore
targets:
  AgentBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: AgentBarCore
    postBuildScripts:
      - name: Bundle agentbar CLI
        script: '"$SRCROOT/Scripts/bundle-cli.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../Packages/AgentBarCore/Sources/agentbar/main.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentbar.AgentBar
        PRODUCT_NAME: AgentBar
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
